name: In-memory library
on: [push, pull_request, workflow_dispatch]
jobs:
  library:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run typecheck
      - uses: actions/cache@v4
        with:
          path: models
          key: vendor-ibis-models-${{ hashFiles('examples/vendor-models.lock.json') }}
      - run: bun run fetch:vendor-models
      - run: bun test
        env:
          IBIS_MODEL_DIR: models
      - run: bun run test:package
      - name: Install ngspice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ngspice=42+ds-3build1
          ngspice --version
      - name: Test constant-high waveform
        env:
          SI_TEST_SWITCHING_NGSPICE: '1'
        run: >-
          bun test tests/simulation/route-network.test.tsx
          --test-name-pattern '^a constant-high driver stays high throughout (the default|an explicit) capture$'
