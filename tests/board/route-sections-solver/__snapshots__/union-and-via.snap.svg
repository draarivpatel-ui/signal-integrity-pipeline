abel="" data-x="4" data-y="1" cx="480" cy="293.65000000000003" r="2.94" fill="white" stroke="#0f172a" stroke-width="0.025"/><circle data-type="circle" data-label="" data-x="-2" data-y="1.3" cx="240" cy="281.65000000000003" r="2.94" fill="white" stroke="#0f172a" stroke-width="0.025"/><circle data-type="circle" data-label="" data-x="2" data-y="1.3" cx="400" cy="281.65000000000003" r="2.94" fill="white" stroke="#0f172a" stroke-width="0.025"/><circle data-type="circle" data-label="" data-x="-4" data-y="-2" cx="160" cy="413.65000000000003" r="2.94" fill="white" stroke="#0f172a" stroke-width="0.025"/><circle data-type="circle" data-label="" data-x="4" data-y="-2" cx="480" cy="413.65000000000003" r="2.94" fill="white" stroke="#0f172a" stroke-width="0.025"/><circle data-type="circle" data-label="" data-x="0" data-y="-2" cx="320" cy="413.65000000000003" r="6" fill="white" stroke="#4338ca" stroke-width="0.025"/><text data-type="text" data-label="Route sections" data-x="-7" data-y="5.6825" x="40" y="106.35000000000002" fill="#0f172a" font-size="18.9" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Route sections</text><text data-type="text" data-label="Ticks mark section boundaries. Circles mark ports and vias. Dashes mark ideal joins." data-x="-7" data-y="5.2975" x="40" y="121.75000000000003" fill="#475569" font-size="10.149999999999999" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Ticks mark section boundaries. Circles mark ports and vias. Dashes mark ideal joins.</text><text data-type="text" data-label="GND · bottom" data-x="-2" data-y="-1.7425" x="240" y="403.35" fill="#0369a1" font-size="11.549999999999997" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">GND · bottom</text><text data-type="text" data-label="GND · bottom" data-x="-3" data-y="1.3074999999999999" x="200" y="281.35" fill="#b45309" font-size="11.549999999999997" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">GND · bottom</text><text data-type="text" data-label="GND · bottom" data-x="0" data-y="1.6575" x="320" y="267.35" fill="#047857" font-size="11.549999999999997" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">GND · bottom</text><text data-type="text" data-label="GND · bottom" data-x="2" data-y="-1.7425" x="400" y="403.35" fill="#6d28d9" font-size="11.549999999999997" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">GND · bottom</text><text data-type="text" data-label="GND · bottom" data-x="3" data-y="1.3074999999999999" x="440" y="281.35" fill="#be185d" font-size="11.549999999999997" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">GND · bottom</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":40,"c":0,"e":320,"b":0,"d":-40,"f":333.65000000000003};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>